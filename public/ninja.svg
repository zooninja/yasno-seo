<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" fill="none">
  <!-- Силует на нинджа: качулка, превръзка с развяващи се краища и светещи очи. Само декор. -->
  <defs>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10222a"/>
      <stop offset="1" stop-color="#060d10"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62f0f0"/>
      <stop offset="1" stop-color="#7ab8ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- развяващи се краища на превръзката -->
  <path d="M168 78 C195 70 210 86 238 72 C226 90 205 92 186 92 Z" fill="url(#band)" opacity=".55"/>
  <path d="M168 86 C190 92 204 112 232 110 C214 124 192 114 178 100 Z" fill="url(#band)" opacity=".35"/>
  <!-- рамене -->
  <path d="M22 260 C28 212 64 192 110 190 C156 192 192 212 198 260 Z" fill="url(#hood)" stroke="#2d4a58" stroke-width="1.5"/>
  <!-- качулка -->
  <path d="M110 22 C160 22 184 62 184 108 C184 156 156 188 110 192 C64 188 36 156 36 108 C36 62 60 22 110 22 Z" fill="url(#hood)" stroke="#2d4a58" stroke-width="1.5"/>
  <!-- превръзка на челото с метална плочка -->
  <path d="M38 78 Q110 56 182 78 L180 92 Q110 72 40 94 Z" fill="url(#band)" opacity=".8"/>
  <rect x="96" y="66" width="28" height="16" rx="2" fill="#0c1519" stroke="#62f0f0" stroke-width="1.2"/>
  <path d="M110 69 L112.5 74 L117 74.5 L112.5 76 L110 80 L107.5 76 L103 74.5 L107.5 74 Z" fill="#6dfca8"/>
  <!-- процеп за очите -->
  <path d="M44 108 Q110 94 176 108 L173 132 Q110 120 47 132 Z" fill="#0f2a2f" stroke="#2a9ea3" stroke-width="1"/>
  <!-- очи -->
  <g filter="url(#glow)" fill="#6dfca8">
    <path d="M70 118 Q84 108 98 118 Q84 124 70 118 Z"/>
    <path d="M122 118 Q136 108 150 118 Q136 124 122 118 Z"/>
  </g>
  <!-- гънки на маската -->
  <path d="M60 150 Q110 162 160 150" stroke="#1c2f37" stroke-width="2"/>
  <path d="M70 166 Q110 176 150 166" stroke="#1c2f37" stroke-width="2"/>
</svg>
